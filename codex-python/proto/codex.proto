syntax = "proto3";

package codex;

// Core message types for Codex protocol
message Message {
  string id = 1;
  MessageType type = 2;
  oneof payload {
    RequestMessage request = 3;
    ResponseMessage response = 4;
    ErrorMessage error = 5;
    NotificationMessage notification = 6;
  }
  uint64 timestamp = 7;
  map<string, string> metadata = 8;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_REQUEST = 1;
  MESSAGE_TYPE_RESPONSE = 2;
  MESSAGE_TYPE_ERROR = 3;
  MESSAGE_TYPE_NOTIFICATION = 4;
}

message RequestMessage {
  string method = 1;
  map<string, Value> params = 2;
  string session_id = 3;
}

message ResponseMessage {
  uint64 request_id = 1;
  Value result = 2;
  bool success = 3;
}

message ErrorMessage {
  uint64 request_id = 1;
  string code = 2;
  string message = 3;
  map<string, Value> data = 4;
}

message NotificationMessage {
  string event = 1;
  map<string, Value> data = 2;
}

// Tool-related messages
message Tool {
  string name = 1;
  string description = 2;
  Schema input_schema = 3;
  repeated string tags = 4;
  string category = 5;
  ToolPermission permission = 6;
}

message Schema {
  string type = 1;
  map<string, Schema> properties = 2;
  repeated string required = 3;
  string description = 4;
  Value default_value = 5;
}

enum ToolPermission {
  TOOL_PERMISSION_UNSPECIFIED = 0;
  TOOL_PERMISSION_ALLOW = 1;
  TOOL_PERMISSION_BLOCK = 2;
  TOOL_PERMISSION_SANDBOX = 3;
}

// Tool execution messages
message ToolCallRequest {
  string tool_name = 1;
  map<string, Value> arguments = 2;
  string session_id = 3;
  bool stream = 4;
  uint32 timeout_ms = 5;
}

message ToolCallResponse {
  string tool_name = 2;
  repeated Content content = 3;
  bool success = 4;
  string error_message = 5;
  uint64 execution_time_ms = 6;
}

message Content {
  ContentType type = 1;
  oneof data {
    TextContent text = 2;
    ImageContent image = 3;
    EmbeddedResource resource = 4;
  }
}

enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_TEXT = 1;
  CONTENT_TYPE_IMAGE = 2;
  CONTENT_TYPE_RESOURCE = 3;
}

message TextContent {
  string text = 1;
  string mime_type = 2;
}

message ImageContent {
  bytes data = 1;
  string mime_type = 2;
}

message EmbeddedResource {
  string uri = 1;
  string mime_type = 2;
  bytes data = 3;
}

// Server configuration messages
message ServerConfig {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  string transport = 4;
  string url = 5;
  map<string, string> env = 6;
  uint32 timeout_s = 7;
}

message ServerStatus {
  string name = 1;
  ServerState state = 2;
  string error_message = 3;
  uint64 connected_at = 4;
  uint64 last_activity = 5;
  uint32 tool_count = 6;
}

enum ServerState {
  SERVER_STATE_DISCONNECTED = 0;
  SERVER_STATE_CONNECTING = 1;
  SERVER_STATE_CONNECTED = 2;
  SERVER_STATE_ERROR = 3;
}

// Authentication messages
message AuthConfig {
  AuthType type = 1;
  string client_id = 2;
  string client_secret = 3;
  string token_url = 4;
  repeated string scopes = 5;
  string bearer_token = 6;
}

enum AuthType {
  AUTH_TYPE_UNSPECIFIED = 0;
  AUTH_TYPE_NONE = 1;
  AUTH_TYPE_OAUTH = 2;
  AUTH_TYPE_BEARER = 3;
}

// Session management
message SessionInfo {
  string id = 1;
  string server_name = 2;
  SessionState state = 3;
  uint64 created_at = 4;
  uint64 last_activity = 5;
  map<string, Value> capabilities = 6;
}

enum SessionState {
  SESSION_STATE_INITIALIZING = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_CLOSING = 2;
  SESSION_STATE_CLOSED = 3;
  SESSION_STATE_ERROR = 4;
}

// Health check messages
message HealthCheckRequest {
  bool include_servers = 1;
  bool include_tools = 2;
}

message HealthCheckResponse {
  OverallHealth overall = 1;
  repeated ServerHealth servers = 2;
}

message OverallHealth {
  HealthStatus status = 1;
  string message = 2;
  uint64 timestamp = 3;
}

message ServerHealth {
  string server_name = 1;
  HealthStatus status = 2;
  string message = 3;
  uint64 response_time_ms = 4;
  uint32 tool_count = 5;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

// Generic value type
message Value {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    ValueList list_value = 5;
    ValueMap map_value = 6;
    bytes bytes_value = 7;
    NullValue null_value = 8;
  }
}

message ValueList {
  repeated Value values = 1;
}

message ValueMap {
  map<string, Value> values = 1;
}

enum NullValue {
  NULL_VALUE = 0;
}

// Streaming messages
message StreamRequest {
  string stream_id = 1;
  string tool_name = 2;
  map<string, Value> arguments = 3;
  StreamOptions options = 4;
}

message StreamResponse {
  string stream_id = 1;
  oneof payload {
    Content content = 2;
    StreamStatus status = 3;
    StreamError error = 4;
  }
}

message StreamOptions {
  uint32 buffer_size = 1;
  uint32 timeout_ms = 2;
  bool include_metadata = 3;
}

message StreamStatus {
  StreamState state = 1;
  string message = 2;
  uint64 progress = 3;
  uint64 total = 4;
}

enum StreamState {
  STREAM_STATE_ACTIVE = 0;
  STREAM_STATE_COMPLETED = 1;
  STREAM_STATE_ERROR = 2;
  STREAM_STATE_CANCELLED = 3;
}

message StreamError {
  string code = 1;
  string message = 2;
  map<string, Value> details = 3;
}

// Service definition
service CodexService {
  // Tool management
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc CallTool(ToolCallRequest) returns (ToolCallResponse);
  rpc StreamTool(StreamToolRequest) returns (stream StreamResponse);
  
  // Server management
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc GetServerStatus(GetServerStatusRequest) returns (ServerStatus);
  rpc AddServer(AddServerRequest) returns (AddServerResponse);
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
  
  // Exec
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc ExecStream(ExecRequest) returns (stream ExecStreamResponse);
  
  // Patch
  rpc ApplyPatch(ApplyPatchRequest) returns (ApplyPatchResponse);
  
  // Session management
  rpc CreateSession(CreateSessionRequest) returns (SessionInfo);
  rpc GetSession(GetSessionRequest) returns (SessionInfo);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  
  // Health checks
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc WatchHealth(WatchHealthRequest) returns (stream HealthCheckResponse);
  
  // Configuration
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
}

message ListToolsRequest {
  string server_name = 1;
  string category = 2;
  repeated string tags = 3;
  ToolPermission permission = 4;
}

message ListToolsResponse {
  repeated Tool tools = 1;
}

message StreamToolRequest {
  repeated StreamRequest requests = 1;
}

message ListServersRequest {
  bool include_status = 1;
}

message ListServersResponse {
  repeated ServerConfig servers = 1;
  repeated ServerStatus statuses = 2;
}

message GetServerStatusRequest {
  string server_name = 1;
}

message AddServerRequest {
  ServerConfig config = 1;
}

message AddServerResponse {
  bool success = 1;
  string message = 2;
}

message RemoveServerRequest {
  string server_name = 1;
}

message RemoveServerResponse {
  bool success = 1;
  string message = 2;
}

message CreateSessionRequest {
  string server_name = 1;
  map<string, Value> options = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  string server_name = 1;
  SessionState state = 2;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool success = 1;
  string message = 2;
}

message WatchHealthRequest {
  uint32 interval_s = 1;
  bool include_servers = 2;
}

message GetConfigRequest {
  bool include_sensitive = 1;
}

message GetConfigResponse {
  map<string, Value> config = 1;
}

message UpdateConfigRequest {
  map<string, Value> updates = 1;
}

message UpdateConfigResponse {
  bool success = 1;
  string message = 2;
  map<string, Value> updated_config = 3;
}

// --- Exec API -----------------------------------------------------------
message ExecRequest {
  repeated string command = 1;
  string cwd = 2;
  map<string, string> env = 3;
}

message ExecResponse {
  bool success = 1;
  int32 returncode = 2;
  string stdout = 3;
  string stderr = 4;
}

message ExecStreamResponse {
  oneof payload {
    ExecDelta delta = 1;
    ExecDone done = 2;
    StreamError error = 3;
  }
}

message ExecDelta {
  string stream = 1; // "stdout" or "stderr"
  bytes data = 2;
}

message ExecDone {
  int32 returncode = 1;
}

// --- Apply Patch API ----------------------------------------------------
message ApplyPatchRequest {
  string patch_text = 1;
  string root_path = 2;
}

message ApplyPatchResponse {
  bool success = 1;
  string message = 2;
}
