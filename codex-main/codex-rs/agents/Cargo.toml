[package]
name = "codex-agents"
version = { workspace = true }
edition = "2024"

[lib]
name = "codex_agents"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
